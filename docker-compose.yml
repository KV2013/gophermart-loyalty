services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: user1
      POSTGRES_PASSWORD: password1
      POSTGRES_DB: gophermart
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "user1 -d gophermart"]
      interval: 3s
      timeout: 3s
      retries: 10
  db2:
    image: postgres:17
    environment:
      POSTGRES_USER: user2
      POSTGRES_PASSWORD: password2
      POSTGRES_DB: accrualdbt  # база данных, к которой подключается бинарник
    ports:
      - "5433:5432"  # другой порт на хосте, чтобы избежать конфликта
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "user2", "-d", "accrualdbt"]
      interval: 3s
      timeout: 3s
      retries: 10
  accrual_svc:
    image: ubuntu:26.04
    ports:
      - "8081:8080"
    volumes:
      - ./cmd/accrual/accrual_linux_amd64:/app/accrual_linux_amd64
    working_dir: /app
    command: >
      /bin/sh -c "
        chmod +x /app/accrual_linux_amd64 &&
        /app/accrual_linux_amd64 -d 'postgres://user2:password2@db2:5432/accrualdbt?sslmode=disable'
      "
    depends_on:
      db2:
        condition: service_healthy
