services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: user1
      POSTGRES_PASSWORD: password1
      POSTGRES_DB: gophermart
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "user1 -d urlshortenergo"]
      interval: 3s
      timeout: 3s
      retries: 10
